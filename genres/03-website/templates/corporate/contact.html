<section class="page-hd">

  <h1 data-split="chars">Contact</h1>
  <p data-reveal="fade-up">お問い合わせ</p>
</section>
<section class="sec">
  <form class="form" novalidate data-reveal="fade-up">
    <fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:700;font-size:var(--fs-s);margin-bottom:.6rem">ご相談内容<span class="req" style="color:var(--c-accent);margin-left:.5em">必須</span></legend>
      <div class="radios"><label><input type="radio" name="type" value="住宅" required checked><span data-sfx="tick">住宅</span></label><label><input type="radio" name="type" value="店舗"><span data-sfx="tick">店舗</span></label><label><input type="radio" name="type" value="オフィス"><span data-sfx="tick">オフィス</span></label><label><input type="radio" name="type" value="その他"><span data-sfx="tick">その他</span></label></div>
    </fieldset>
    <label>お名前<span class="req">必須</span><input name="name" required autocomplete="name"></label>
    <label>メールアドレス<span class="req">必須</span><input name="email" type="email" required autocomplete="email"></label>
    <label>電話番号<input name="tel" type="tel" autocomplete="tel"></label>
    <label>ご相談の詳細<textarea name="message"></textarea></label>
    <label style="display:flex;align-items:center;gap:.6rem;font-weight:500"><input type="checkbox" required> <span><a href="#">プライバシーポリシー</a>に同意する</span></label>
    <div><button class="btn" type="submit" data-magnetic>送信する <span class="arrow">→</span></button></div>
  </form>
</section>
