<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>書き出しテスト用バナー</title>
<!-- 書き出しツールの動作確認用。外部ファイルに頼らず、図形・角丸・枠線・グラデーション・回転・影・疑似要素・SVG・複数行の文字を含む -->
<style>
  html, body { margin: 0; background: #222; }
  .ab { position: relative; width: 1200px; height: 628px; overflow: hidden; background: #f6f1ea; font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; color: #1d2433; }
  .ab::before { content: ""; position: absolute; right: -120px; top: -160px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffcf7a, #ff7a59); }
  .label { position: absolute; left: 72px; top: 72px; padding: 10px 22px; background: #1d2433; color: #fff; font-size: 26px; font-weight: 700; letter-spacing: .08em; transform: rotate(-3deg); }
  h1 { position: absolute; left: 72px; top: 150px; margin: 0; font-size: 76px; line-height: 1.25; font-weight: 900; }
  h1 .hl { background: #ffd84d; padding: 0 .08em; }
  h1 em { font-style: normal; color: #e2533c; }
  .lead { position: absolute; left: 72px; top: 370px; width: 560px; margin: 0; font-size: 26px; line-height: 1.7; color: #4a5468; }
  .cta { position: absolute; left: 72px; bottom: 64px; display: flex; align-items: center; gap: 14px; padding: 20px 40px; border-radius: 999px; background: #e2533c; color: #fff; font-size: 28px; font-weight: 700; box-shadow: 0 12px 24px rgb(226 83 60 / .35); }
  .cta svg { width: 28px; height: 28px; }
  .card { position: absolute; right: 96px; bottom: 80px; width: 340px; padding: 28px 32px; background: #fff; border: 4px solid #1d2433; border-radius: 24px; text-align: center; }
  .card b { display: block; font-size: 64px; line-height: 1.1; color: #1d2433; }
  .card span { font-size: 22px; color: #4a5468; }
</style>
</head>
<body>
<div class="ab" data-artboard>
  <div class="label">NEW OPEN</div>
  <h1>はじめての<span class="hl">家庭菜園</span>、<br><em>3つ</em>の道具でOK</h1>
  <p class="lead">プランター・土・種だけで、ベランダでも今日から始められます。</p>
  <div class="cta">無料ガイドを見る<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <div class="card"><b>¥0</b><span>まずはガイドを無料で</span></div>
</div>
</body>
</html>
